<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cube Twist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen app — toolbar on top, the cube fills the stage, a move-notation strip underneath. */
:root {
  --bg: #e6e9ef;
  --panel: #f7f8fb;
  --ink: #161a23;
  --muted: #5d6578;
  --line: #ccd2dd;
  --accent: #1f4fd1;
  --accent-ink: #ffffff;
  --good: #14804a;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141b; --panel: #1a1e28; --ink: #e9ecf3; --muted: #98a1b5; --line: #2c3241;
    --accent: #7b9cff; --accent-ink: #0d1120; --good: #4cd38a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141b; --panel: #1a1e28; --ink: #e9ecf3; --muted: #98a1b5; --line: #2c3241;
  --accent: #7b9cff; --accent-ink: #0d1120; --good: #4cd38a; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 var(--font-body);
  overflow: hidden;
}
.app {
  height: 100%; display: grid; grid-template-rows: auto 1fr auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; gap: 10px; box-sizing: border-box;
}
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.logo { display: grid; grid-template-columns: repeat(3, 7px); gap: 2px; }
.logo i { width: 7px; height: 7px; border-radius: 2px; display: block; }
h1 { font: 700 22px/1 var(--font-display); letter-spacing: -0.01em; margin: 0; }
.stats { display: flex; gap: 20px; }
.stat { display: flex; flex-direction: column; }
.stat span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.stat b { font: 700 20px/1.1 var(--font-mono); font-variant-numeric: tabular-nums; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select {
  font: 600 14px/1 var(--font-body); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; cursor: pointer;
}
button:hover, select:hover { border-color: var(--muted); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#stage { position: relative; min-height: 0; border-radius: 14px; overflow: hidden; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
.status {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 2;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 14px; font-weight: 500; color: var(--muted); white-space: nowrap; pointer-events: none;
  max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis;
}
.status.live { color: var(--accent); border-color: var(--accent); }
.status.done { color: var(--good); border-color: var(--good); }
.win {
  position: absolute; inset: auto 12px 12px; z-index: 3; margin: 0 auto; max-width: 340px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px 20px; display: grid; gap: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.18);
}
.win h2 { margin: 0; font: 700 24px/1.1 var(--font-display); color: var(--good); }
.win p { margin: 0; color: var(--muted); }
.win .row { display: flex; gap: 8px; }
.foot { display: grid; gap: 6px; }
.log {
  font: 500 14px/1.6 var(--font-mono); min-height: 1.6em; white-space: nowrap; overflow-x: auto;
  color: var(--ink); scrollbar-width: none;
}
.log::-webkit-scrollbar { display: none; }
.log:empty::before { content: "Your turns appear here in cube notation (R U R' U' …)"; color: var(--muted); font-family: var(--font-body); }
.log em { color: var(--muted); font-style: normal; }
.help { margin: 0; color: var(--muted); font-size: 13px; }
kbd { font: 600 12px var(--font-mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--panel); }
@media (max-width: 560px) {
  h1 { font-size: 19px; }
  .stats { gap: 14px; }
  .stat b { font-size: 17px; }
  button, select { padding: 8px 11px; }
  .help .keys { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <i style="background:#c8102e"></i><i style="background:#f4f4f4"></i><i style="background:#0051ba"></i>
        <i style="background:#ffd100"></i><i style="background:#009a44"></i><i style="background:#ff6a13"></i>
        <i style="background:#0051ba"></i><i style="background:#c8102e"></i><i style="background:#ffd100"></i>
      </div>
      <h1>Cube Twist</h1>
    </div>
    <div class="stats">
      <div class="stat"><span>Time</span><b id="time">0:00.00</b></div>
      <div class="stat"><span>Moves</span><b id="moves">0</b></div>
      <div class="stat"><span>Best</span><b id="best">–</b></div>
    </div>
    <div class="controls">
      <select id="size" aria-label="Cube size">
        <option value="2">2×2×2</option>
        <option value="3" selected>3×3×3</option>
        <option value="4">4×4×4</option>
        <option value="5">5×5×5</option>
      </select>
      <button id="scramble" class="primary">Scramble</button>
      <button id="undo">Undo</button>
      <button id="reset">Reset</button>
    </div>
  </header>

  <main id="stage">
    <div id="status" class="status">Free play. Press Scramble to start a timed solve.</div>
    <div id="win" class="win" hidden>
      <h2>Solved!</h2>
      <p id="winText"></p>
      <div class="row">
        <button id="again" class="primary">Scramble again</button>
        <button id="close">Close</button>
      </div>
    </div>
  </main>

  <footer class="foot">
    <div id="log" class="log" aria-live="polite"></div>
    <p class="help">Drag a face to turn that layer. Drag empty space to look around, scroll to zoom.
      <span class="keys">Keys: <kbd>U</kbd> <kbd>D</kbd> <kbd>L</kbd> <kbd>R</kbd> <kbd>F</kbd> <kbd>B</kbd> <kbd>M</kbd> <kbd>E</kbd> <kbd>S</kbd>, hold <kbd>Shift</kbd> for counter-clockwise, <kbd>Ctrl</kbd>+<kbd>Z</kbd> to undo.</span></p>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const THREE = window.THREE;
  const stage = document.getElementById('stage');
  const $ = (id) => document.getElementById(id);
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  stage.prepend(renderer.domElement);
  const canvas = renderer.domElement;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
  scene.add(camera);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x50525a, 0.75));
  const keyLight = new THREE.DirectionalLight(0xffffff, 0.75);
  keyLight.position.set(3, 6, 4);
  camera.add(keyLight);

  // Standard colour scheme: white opposite yellow, green opposite blue, red opposite orange.
  const FACES = [
    { n: [1, 0, 0], c: 'R' }, { n: [-1, 0, 0], c: 'L' },
    { n: [0, 1, 0], c: 'U' }, { n: [0, -1, 0], c: 'D' },
    { n: [0, 0, 1], c: 'F' }, { n: [0, 0, -1], c: 'B' },
  ];
  const COLORS = { R: 0xc8102e, L: 0xff6a13, U: 0xf4f4f4, D: 0xffd100, F: 0x009a44, B: 0x0051ba };
  const stickerMats = {};
  for (const k in COLORS) stickerMats[k] = new THREE.MeshStandardMaterial({ color: COLORS[k], roughness: 0.35, metalness: 0 });
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x15171c, roughness: 0.6, metalness: 0.05 });
  const bodyGeo = new THREE.BoxGeometry(0.98, 0.98, 0.98);
  const stickerGeo = roundedRect(0.84, 0.13);

  function roundedRect(size, r) {
    const h = size / 2, s = new THREE.Shape();
    s.moveTo(-h + r, -h); s.lineTo(h - r, -h); s.quadraticCurveTo(h, -h, h, -h + r);
    s.lineTo(h, h - r); s.quadraticCurveTo(h, h, h - r, h);
    s.lineTo(-h + r, h); s.quadraticCurveTo(-h, h, -h, h - r);
    s.lineTo(-h, -h + r); s.quadraticCurveTo(-h, -h, -h + r, -h);
    return new THREE.ShapeGeometry(s, 4);
  }

  // ---------- Cube model ----------
  let N = 3, half = 1, cubeGroup = null, pivot = null, cubies = [];
  const queue = [];
  let anim = null;

  function build(n) {
    if (cubeGroup) scene.remove(cubeGroup);
    N = n; half = (n - 1) / 2;
    cubeGroup = new THREE.Group();
    pivot = new THREE.Group();
    cubeGroup.add(pivot);
    scene.add(cubeGroup);
    cubies = [];
    const z0 = new THREE.Vector3(0, 0, 1);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) for (let k = 0; k < n; k++) {
      const v = [i - half, j - half, k - half];
      if (Math.abs(v[0]) < half && Math.abs(v[1]) < half && Math.abs(v[2]) < half) continue;
      const c = new THREE.Mesh(bodyGeo, bodyMat);
      c.position.set(v[0], v[1], v[2]);
      for (const f of FACES) {
        const ax = f.n.findIndex((a) => a !== 0);
        if (v[ax] * f.n[ax] !== half) continue;
        const normal = new THREE.Vector3(f.n[0], f.n[1], f.n[2]);
        const s = new THREE.Mesh(stickerGeo, stickerMats[f.c]);
        s.position.copy(normal).multiplyScalar(0.495);
        s.quaternion.setFromUnitVectors(z0, normal);
        s.userData = { normal, color: f.c };
        c.add(s);
      }
      cubeGroup.add(c);
      cubies.push(c);
    }
  }

  function snap(c) {
    const r = (x) => Math.round(x * 2) / 2;
    c.position.set(r(c.position.x), r(c.position.y), r(c.position.z));
    const m = new THREE.Matrix4().makeRotationFromQuaternion(c.quaternion);
    const e = m.elements;
    for (const i of [0, 1, 2, 4, 5, 6, 8, 9, 10]) e[i] = Math.round(e[i]);
    c.quaternion.setFromRotationMatrix(m);
  }

  function isSolved() {
    const seen = {};
    const n = new THREE.Vector3();
    for (const c of cubies) {
      for (const s of c.children) {
        n.copy(s.userData.normal).applyQuaternion(c.quaternion);
        const key = Math.round(n.x) + ',' + Math.round(n.y) + ',' + Math.round(n.z);
        if (seen[key] === undefined) seen[key] = s.userData.color;
        else if (seen[key] !== s.userData.color) return false;
      }
    }
    return true;
  }

  function startNext(now) {
    const m = queue.shift();
    pivot.rotation.set(0, 0, 0);
    pivot.updateMatrixWorld(true);
    const sel = cubies.filter((c) => Math.abs(c.position[m.axis] - m.layer) < 0.1);
    sel.forEach((c) => pivot.attach(c));
    const dur = m.fast ? 55 : (reduceMotion ? 60 : 190);
    anim = { m, sel, start: now, dur };
  }

  function finishAnim() {
    const { m, sel } = anim;
    pivot.rotation[m.axis] = m.dir * Math.PI / 2;
    pivot.updateMatrixWorld(true);
    sel.forEach((c) => { cubeGroup.attach(c); snap(c); });
    pivot.rotation.set(0, 0, 0);
    anim = null;
    onMoveDone(m);
  }

  // ---------- Notation ----------
  // A move turns the layer at coordinate `layer` on `axis` by dir * 90° (right-hand rule).
  const FACE_NAMES = { x: ['R', 'L'], y: ['U', 'D'], z: ['F', 'B'] };
  const SLICES = { x: ['M', 1], y: ['E', 1], z: ['S', -1] }; // M follows L, E follows D, S follows F
  function notation(m) {
    if (Math.abs(m.layer) < 0.01) {
      const [name, cw] = SLICES[m.axis];
      return name + (m.dir === cw ? '' : "'");
    }
    const s = m.layer > 0 ? 1 : -1;
    const face = FACE_NAMES[m.axis][s > 0 ? 0 : 1];
    const depth = Math.round(half - Math.abs(m.layer)) + 1;
    return (depth > 1 ? depth : '') + face + (m.dir === -s ? '' : "'");
  }
  function faceMove(letter, prime) {
    for (const axis in FACE_NAMES) {
      const idx = FACE_NAMES[axis].indexOf(letter);
      if (idx < 0) continue;
      const s = idx === 0 ? 1 : -1;
      return { axis, layer: s * half, dir: -s * (prime ? -1 : 1) };
    }
    for (const axis in SLICES) {
      if (SLICES[axis][0] === letter && N % 2 === 1) {
        return { axis, layer: 0, dir: SLICES[axis][1] * (prime ? -1 : 1) };
      }
    }
    return null;
  }

  // ---------- Game state ----------
  let state = 'idle'; // idle | scrambling | ready | solving | solved
  let moves = 0, t0 = 0, elapsed = 0;
  let history = [], log = [];

  const busy = () => !!anim || queue.length > 0;

  function bestKey() { return 'cube-twist-best-' + N; }
  function getBest() {
    try { const v = localStorage.getItem(bestKey()); return v ? JSON.parse(v) : null; } catch (e) { return null; }
  }
  function setBest(b) { try { localStorage.setItem(bestKey(), JSON.stringify(b)); } catch (e) { /* storage unavailable */ } }

  function fmt(ms) {
    const cs = Math.floor(ms / 10), m = Math.floor(cs / 6000), s = Math.floor(cs / 100) % 60, c = cs % 100;
    return m + ':' + String(s).padStart(2, '0') + '.' + String(c).padStart(2, '0');
  }

  function onMoveDone(m) {
    if (m.kind === 'scramble') {
      if (m.last) { state = 'ready'; updateUI(); }
      return;
    }
    if (m.kind === 'user') { history.push(m); log.push(notation(m)); }
    else if (m.kind === 'undo') { log.pop(); }
    moves++;
    if (state === 'solved') state = 'idle';
    if (state === 'ready') { state = 'solving'; t0 = performance.now(); }
    if (state === 'solving' && isSolved()) {
      state = 'solved';
      elapsed = performance.now() - t0;
      const best = getBest();
      const record = !best || elapsed < best.time;
      if (record) setBest({ time: elapsed, moves });
      $('winText').textContent = fmt(elapsed) + ' in ' + moves + ' moves on the ' + N + '×' + N + '×' + N + '.' +
        (record ? ' New personal best.' : ' Best: ' + fmt(best.time) + '.');
      $('win').hidden = false;
    }
    updateUI();
  }

  function userMove(m) {
    if (state === 'scrambling' || queue.length > 3) return;
    queue.push({ axis: m.axis, layer: m.layer, dir: m.dir, kind: 'user' });
  }

  function resetCube() {
    queue.length = 0; anim = null;
    build(N);
    moves = 0; elapsed = 0; history = []; log = [];
    state = 'idle';
    $('win').hidden = true;
    placeCamera();
    updateUI();
  }

  function scramble() {
    if (state === 'scrambling') return;
    resetCube();
    state = 'scrambling';
    const layers = [];
    for (let i = 0; i < N; i++) layers.push(i - half);
    const count = N === 2 ? 14 : N * 7 + 4;
    let prev = null;
    for (let i = 0; i < count; i++) {
      let m;
      do {
        m = {
          axis: 'xyz'[Math.floor(Math.random() * 3)],
          layer: layers[Math.floor(Math.random() * N)],
          dir: Math.random() < 0.5 ? 1 : -1,
        };
      } while (prev && prev.axis === m.axis && prev.layer === m.layer);
      prev = m;
      queue.push(Object.assign(m, { kind: 'scramble', fast: true, last: i === count - 1 }));
    }
    updateUI();
  }

  function undo() {
    if (busy() || state === 'scrambling' || state === 'solved' || !history.length) return;
    const m = history.pop();
    queue.push({ axis: m.axis, layer: m.layer, dir: -m.dir, kind: 'undo' });
  }

  function updateUI() {
    $('moves').textContent = moves;
    const best = getBest();
    $('best').textContent = best ? fmt(best.time) : '–';
    const st = $('status');
    st.className = 'status';
    if (state === 'idle') st.textContent = 'Free play. Press Scramble to start a timed solve.';
    else if (state === 'scrambling') st.textContent = 'Scrambling…';
    else if (state === 'ready') { st.textContent = 'Scrambled. The timer starts on your first turn.'; st.classList.add('live'); }
    else if (state === 'solving') { st.textContent = 'Solving'; st.classList.add('live'); }
    else if (state === 'solved') { st.textContent = 'Solved in ' + fmt(elapsed); st.classList.add('done'); }
    if (state === 'idle' || state === 'scrambling' || state === 'ready') $('time').textContent = fmt(0);
    if (state === 'solved') $('time').textContent = fmt(elapsed);
    $('undo').disabled = !history.length || state === 'scrambling' || state === 'solved';
    const shown = log.slice(-60);
    $('log').innerHTML = (log.length > 60 ? '<em>… </em>' : '') + shown.join(' ').replace(/</g, '&lt;');
    $('log').scrollLeft = 1e6;
  }

  // ---------- Camera ----------
  const orbit = { theta: 0.62, phi: 0.98, zoom: 1 };
  let viewW = 1, viewH = 1;
  function placeCamera() {
    const aspect = viewW / viewH;
    const r = (3.1 * N + 1.6) / Math.min(1, aspect * 1.1) * orbit.zoom;
    camera.position.setFromSphericalCoords(r, orbit.phi, orbit.theta);
    camera.lookAt(0, 0, 0);
  }
  function resize() {
    const r = stage.getBoundingClientRect();
    viewW = Math.max(1, r.width); viewH = Math.max(1, r.height);
    renderer.setSize(viewW, viewH, false);
    camera.aspect = viewW / viewH;
    camera.updateProjectionMatrix();
    placeCamera();
  }
  new ResizeObserver(resize).observe(stage);

  // ---------- Input ----------
  const raycaster = new THREE.Raycaster();
  function pick(e) {
    const r = canvas.getBoundingClientRect();
    const ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(cubies, false);
    return hits[0] || null;
  }
  function toScreen(v) {
    const p = v.clone().project(camera);
    return { x: (p.x + 1) / 2 * viewW, y: (1 - p.y) / 2 * viewH };
  }

  function turnFromDrag(hit, dx, dy) {
    const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld).round();
    const P = hit.point.clone();
    const sp = toScreen(P);
    const len = Math.hypot(dx, dy);
    let best = null, bestDot = -Infinity;
    for (const base of [[1, 0, 0], [0, 1, 0], [0, 0, 1]]) {
      const d = new THREE.Vector3(base[0], base[1], base[2]);
      if (Math.abs(d.dot(n)) > 0.5) continue;
      for (const s of [1, -1]) {
        const dd = d.clone().multiplyScalar(s);
        const q = toScreen(P.clone().add(dd));
        const vx = q.x - sp.x, vy = q.y - sp.y, l = Math.hypot(vx, vy) || 1;
        const dot = (vx * dx + vy * dy) / (l * len);
        if (dot > bestDot) { bestDot = dot; best = dd; }
      }
    }
    // Rotating +90° about (n × d) moves a sticker on face n in direction d.
    const a = n.clone().cross(best).round();
    const axis = Math.abs(a.x) > 0.5 ? 'x' : Math.abs(a.y) > 0.5 ? 'y' : 'z';
    userMove({ axis, layer: Math.round(hit.object.position[axis] * 2) / 2, dir: a[axis] > 0 ? 1 : -1 });
  }

  let drag = null;
  canvas.addEventListener('pointerdown', (e) => {
    if (drag) return;
    canvas.setPointerCapture(e.pointerId);
    const hit = pick(e);
    if (hit) drag = { id: e.pointerId, type: busy() || state === 'scrambling' ? 'none' : 'cube', x: e.clientX, y: e.clientY, hit };
    else drag = { id: e.pointerId, type: 'orbit', x: e.clientX, y: e.clientY };
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (drag.type === 'orbit') {
      orbit.theta -= dx * 0.008;
      orbit.phi = Math.min(Math.PI - 0.15, Math.max(0.15, orbit.phi - dy * 0.008));
      drag.x = e.clientX; drag.y = e.clientY;
      placeCamera();
    } else if (drag.type === 'cube' && Math.hypot(dx, dy) > 10) {
      turnFromDrag(drag.hit, dx, dy);
      drag.type = 'none';
    }
  });
  const endDrag = (e) => { if (drag && e.pointerId === drag.id) drag = null; };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    orbit.zoom = Math.min(1.8, Math.max(0.6, orbit.zoom * (1 + e.deltaY * 0.001)));
    placeCamera();
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT')) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const letter = e.key.toUpperCase();
    if (!/^[UDLRFBMES]$/.test(letter)) return;
    const m = faceMove(letter, e.shiftKey);
    if (m) { e.preventDefault(); userMove(m); }
  });

  $('scramble').addEventListener('click', scramble);
  $('again').addEventListener('click', scramble);
  $('reset').addEventListener('click', resetCube);
  $('undo').addEventListener('click', undo);
  $('close').addEventListener('click', () => { $('win').hidden = true; });
  $('size').addEventListener('change', (e) => { N = parseInt(e.target.value, 10); orbit.zoom = 1; resetCube(); });

  // ---------- Loop ----------
  function tick(now) {
    if (anim) {
      const t = Math.min(1, (now - anim.start) / anim.dur);
      const eased = 1 - Math.pow(1 - t, 3);
      pivot.rotation[anim.m.axis] = anim.m.dir * Math.PI / 2 * eased;
      if (t >= 1) finishAnim();
    }
    if (!anim && queue.length) startNext(now);
    if (state === 'solving') $('time').textContent = fmt(now - t0);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }

  build(N);
  resize();
  updateUI();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
